name: flutter_mvvm_template
description: A Flutter MVVM template with dark mode and i18n support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Dependency Injection
  get_it: ^7.6.4

  # Network
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2

  # File Management
  path_provider: ^2.1.1
  permission_handler: ^11.4.0
  open_file: ^3.1.0
  file_picker: ^6.0.0
  url_launcher: ^6.2.2
 
  # Internationalization
  intl: ^0.20.2

  # Routing
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  msix: ^3.16.7  # Pour créer l'installateur Windows
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logo.png


# Configuration MSIX pour Windows
msix_config:
  display_name: Flutter MVVM Template
  publisher_display_name: YourName
  identity_name: com.yourcompany.fluttermvvmtemplate
  msix_version: 1.0.0.0
  logo_path: assets/icon.png  # Créez ce fichier (256x256 px minimum)
  
  # Capacités de l'application (permissions Windows)
  capabilities: internetClient
  
  # Optionnel : Personnalisation avancée
  # publisher: CN=YourPublisher
  # certificate_path: path/to/certificate.pfx
  # certificate_password: your_password
  
  # Architecture
  architecture: x64
  
  # Langue
  languages: en-us, fr-fr

# Configuration des icônes de l'application
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"