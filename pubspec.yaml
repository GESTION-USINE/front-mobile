name: flutter_mvvm_template
description: A Flutter MVVM template with dark mode and i18n support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Dependency Injection
  get_it: ^7.6.4

  # Network
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2

  # File Management
  path_provider: ^2.1.1
  permission_handler: ^11.4.0
  open_file: ^3.1.0
  file_picker: ^6.0.0
  url_launcher: ^6.2.2
  # Internationalization
  intl: ^0.20.2

  # Routing
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # Assets pour les traductions
  # assets:
  #   - assets/lang/
